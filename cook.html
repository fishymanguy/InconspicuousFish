<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cook a Fish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <nav>
        <a href="index.html">Make a fish</a>
        <a href="cook.html" aria-current="page">Cook a fish</a>
    </nav>

    <h1>Cook a fish</h1>
    <p class="lede">Drop your fish here to cook it!</p>

    <section class="card">
        <form id="cook-form">
            <label for="fish-file">Fish image</label>
            <div class="row">
                <input id="fish-file" name="fish-file" type="file" accept="image/png,image/*" required>
                <button id="submit" type="submit">Cook my inconspicuous fish please!</button>
            </div>
            <figure id="preview" hidden>
                <img id="preview-image" alt="Selected image">
            </figure>
            <p id="status" role="status" aria-live="polite"></p>
        </form>
    </section>

    <section id="result" class="card" hidden>
        <h2 id="result-title">Cooking result</h2>
        <div class="row">
            <button id="copy-string" type="button">Copy text</button>
            <a id="download-text" class="button secondary">Download text file</a>
        </div>
    </section>

    <footer class="version">Latest version: <!--VERSION-->2026-11-14 10:05:05<!--/VERSION--></footer>
</main>
<script src="file-check.js"></script>
<script type="module" src="cook.js"></script>
</body>
</html>
